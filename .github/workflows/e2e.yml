name: Cypress Tests + Allure Report

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  cypress-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Cypress tests
        run: npm test
        env:
          CYPRESS_VIDEO: true

      - name: Install Allure CLI
        if: always()
        run: npm install -g allure-commandline --save-dev

      - name: Generate Allure report
        if: always()
        run: |
          mkdir -p allure-report
          allure generate allure-results --clean -o allure-report || echo "No Allure results — skipping report generation"

      - name: Setup Pages
        if: always()
        uses: actions/configure-pages@v5

      - name: Upload Allure Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 1

      - name: Upload Pages Artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report/

      - name: Deploy to GitHub Pages
        if: always()
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Display Allure Report URL
        if: always()
        run: |
          echo "Allure Report: ${{ steps.deployment.outputs.page_url || 'https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/index.html' }}"
